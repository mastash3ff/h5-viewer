name: Feature request
description: Describe a workflow H5 Viewer could support better.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the data structure and workflow without sharing private data.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed behavior
      description: Explain how this would help and any alternatives you have tried.
    validations:
      required: true
