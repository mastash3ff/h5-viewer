name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_sha:
        description: Full commit SHA to check and build
        required: true
        type: string

permissions:
  contents: read

env:
  UV_VERSION: '0.11.32'
  PYTHON_VERSION: '3.13'

jobs:
  quality:
    name: Quality and distributions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout
        env:
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv build --no-sources

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: uv sync --locked
      - run: uv run --locked pytest --junitxml=test-results.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}-${{ github.run_attempt }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14

  windows:
    name: Windows packages and smoke
    needs: [quality, tests]
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Verify checkout
        env:
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          if ((git rev-parse HEAD) -ne $env:EXPECTED_SHA) { throw 'Unexpected checkout SHA' }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve checkout SHA' }
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      - name: Build fresh Windows packages
        run: |
          ./scripts/build_windows.ps1 -BuildRoot "$env:RUNNER_TEMP/h5-viewer-build" -OutputRoot "$env:RUNNER_TEMP/h5-viewer-release"
      - name: Exercise portable package and installer lifecycle
        run: |
          $python = "$env:RUNNER_TEMP/h5-viewer-build/source/.venv/Scripts/python.exe"
          $version = & $python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read package version' }
          ./scripts/smoke_windows.ps1 `
            -PortableZip "$env:RUNNER_TEMP/h5-viewer-release/H5Viewer-$version-windows-x64-portable.zip" `
            -Installer "$env:RUNNER_TEMP/h5-viewer-release/H5Viewer-$version-windows-x64-setup.exe" `
            -OutputRoot "$env:RUNNER_TEMP/h5-viewer-checks" `
            -PythonExe $python -TestInstallerLifecycle
      - name: Verify release inventory after smoke
        env:
          EXPECTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          $python = "$env:RUNNER_TEMP/h5-viewer-build/source/.venv/Scripts/python.exe"
          $version = & $python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read package version' }
          & $python scripts/release.py verify --version $version --sha $env:EXPECTED_SHA --assets "$env:RUNNER_TEMP/h5-viewer-release"
          if ($LASTEXITCODE -ne 0) { throw 'Release inventory validation failed' }
      - name: Upload exact release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-${{ inputs.source_sha || github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h5-viewer-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload smoke reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-checks-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/h5-viewer-checks/*.json
            ${{ runner.temp }}/h5-viewer-checks/*.log
            ${{ runner.temp }}/h5-viewer-checks/*.txt
          if-no-files-found: ignore
          retention-days: 14
