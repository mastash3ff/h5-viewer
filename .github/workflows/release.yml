name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version matching pyproject.toml (for example 0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate version and reject existing release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/release.py preflight --version "$VERSION" --sha "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY"
      - id: commit
        name: Capture immutable commit
        run: echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  checks:
    name: Required checks
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: read

  codeql:
    name: Require CodeQL for release commit
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Wait for successful CodeQL check
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: python3 scripts/release.py wait-codeql --sha "$SOURCE_SHA" --repo "$GITHUB_REPOSITORY"

  draft:
    name: Create draft from verified assets
    needs: [prepare, checks, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Download assets from this invocation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-${{ needs.prepare.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-assets
      - name: Validate assets and create a new draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          python3 scripts/release.py draft --version "$VERSION" --sha "$SOURCE_SHA" \
            --repo "$GITHUB_REPOSITORY" --assets "$RUNNER_TEMP/release-assets"
