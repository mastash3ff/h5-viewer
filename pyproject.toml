[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "h5-viewer"
version = "0.1.0"
description = "A general-purpose, read-only HDF5 desktop explorer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brandon Sheffield" }]
requires-python = ">=3.13,<3.14"
dependencies = ["h5py>=3.14,<4", "numpy>=2.2,<3", "PySide6>=6.8,<7", "pyqtgraph>=0.13.7,<0.15"]

[project.urls]
Homepage = "https://github.com/mastash3ff/h5-viewer"
Documentation = "https://github.com/mastash3ff/h5-viewer/blob/main/docs/USER_GUIDE.md"
Issues = "https://github.com/mastash3ff/h5-viewer/issues"
Source = "https://github.com/mastash3ff/h5-viewer"

[project.gui-scripts]
h5-viewer = "h5_viewer.app:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.11", "pyinstaller>=6.12,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/h5_viewer"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/packaging", "/docs", "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/SECURITY.md", "/pyproject.toml", "/uv.lock"]
